# Save this as: .github/workflows/snake.yml  (in your Hugo-Code21/Hugo-Code21 profile repo)
name: Generate Contribution Snake 🐍

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  # Also run whenever you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colorful purple-to-pink contribution dots with a pink snake
          outputs: |
            dist/github-snake.svg?color_snake=#ff6ac1&color_dots=#161b22,#4c3a7a,#7f52ff,#c084fc,#f0abfc

      - name: Push to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}